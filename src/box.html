<!DOCTYPE html>
<html>
<head>
<style>
#container {
    position: relative;
    background: purple;
    width: 400px;
    height: 400px;
  }
  
  #box {
    background: red;
    position: absolute;
    width: 30px;
    height: 30px;
  }
</style>
</head>
<body>

<button class="up" onclick="up()">U</button>

<button class="left" onclick="left()">L</button>

<button class="right" onclick="right()">R</button>

<button class="down" onclick="down()">D</button>

<br/>

  <div id="box" style="top: 0px; left: 0px;"></div>

<script>
var box = document.getElementById("box");

function up() {
  box.style.top = (parseInt(box.style.top) - 30) + 'px';
}

function right() {
  box.style.left = (parseInt(box.style.left) + 30) + 'px';
}

function left() {
  box.style.left = (parseInt(box.style.left) - 30) + 'px';
}

function down() {
  box.style.top = (parseInt(box.style.top) + 30) + 'px';
}
</script>

</body>
</html>

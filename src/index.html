<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scaling Web Page</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Hide scroll bars */
  }
  
  .container {
    width: 100vw; /* 100% of viewport width */
    height: 100vh; /* 100% of viewport height */
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  
  .content {
    max-width: 90%; /* Adjust as needed */
    max-height: 90%; /* Adjust as needed */
    text-align: center;
  }
  .hexagon-container {
  width: 500px; /* Adjust width as needed */
  height: 500px; /* Adjust height as needed */
  position: relative;
  margin: auto;
}

.hexagon {
  width: 100px;
  height: 100px;
  background-color: #ccc;
  position: absolute;
}

.central {
  top: 47%; /* Adjust vertical position */
  left: 47%; /* Adjust horizontal position */
}

.hexagon:nth-child(2) {
  top: 0;
  left: 25%;
}

.hexagon:nth-child(3) {
  top: 50%;
  left: 0;
}

.hexagon:nth-child(4) {
  top: 100%;
  left: 25%;
}

.hexagon:nth-child(5) {
  top: 100%;
  left: 75%;
}

.hexagon:nth-child(6) {
  top: 50%;
  left: 100%;
}

.hexagon:nth-child(7) {
  top: 0;
  left: 75%;
}

.hexagon:before,
.hexagon:after {
  content: '';
  position: absolute;
  width: 0;
  border-left: 50px solid transparent;
  border-right: 50px solid transparent;
}

.hexagon:before {
  top: -86px;
  border-bottom: 86px solid #ccc;
}

.hexagon:after {
  bottom: -86px;
  border-top: 86px solid #ccc;
}
</style>
</head>
<body>

<div class="container">
  <div class="hexagon-container">
  <div class="hexagon central"></div>
  <div class="hexagon"></div>
  <div class="hexagon"></div>
  <div class="hexagon"></div>
  <div class="hexagon"></div>
  <div class="hexagon"></div>
  <div class="hexagon"></div>
</div>
</div>

  
</body>
</html>

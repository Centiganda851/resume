<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scaling Web Page</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Hide scroll bars */
  }
  
  .container {
    width: 100vw; /* 100% of viewport width */
    height: 100vh; /* 100% of viewport height */
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  
  .content {
    max-width: 90%; /* Adjust as needed */
    max-height: 90%; /* Adjust as needed */
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <div class="content">
    <h1>Scaling Web Page</h1>
    <p>This is a demonstration of scaling the web page to fit the size of the screen viewing it.</p>
  </div>
</div>

</body>
</html>
